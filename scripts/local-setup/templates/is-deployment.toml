# --- Token introspection for CDS ------------------------------------------- #
# CDS introspects every bearer token it receives against the super tenant, with
# its own client credentials. The default policy does not allow that.
[[resource.access_control]]
context = "(.*)/oauth2/introspect(.*)"
secure = "true"
http_method = "all"
cross_tenant = true
cross_access_allowed_tenants = "carbon.super"
allowed_auth_handlers = "BasicClientAuthentication"
permissions = ["/permission/admin/manage/identity/applicationmgt/view"]
scopes = ["internal_application_mgt_view"]

# --- CORS ------------------------------------------------------------------ #
[cors]
allowed_origins = ["${IS_BASE}", "${CDS_BASE}", "https://localhost:9001", "https://localhost:9000"]
supported_methods = ["GET", "POST", "HEAD", "OPTIONS", "PUT", "PATCH", "DELETE"]
exposed_headers = ["Location"]

# --- Console wiring -------------------------------------------------------- #
# cds_host makes the Console call CDS directly. Without it the Console builds
# CDS URLs off the IS origin, where nothing serves /cds/api/v1.
[console.extensions]
cds_host = "${CDS_BASE}"
cds_application_identifier_type = "client_id"

[console.customer_data_service]
enabled = true

[console.customer_data_service.scopes]
feature = ["console:customerData"]
read = ["internal_cds_admin_config_view"]
create = []
update = ["internal_cds_admin_config_update", "internal_cds_profile_update"]
delete = []

[console.customer_data_profiles]
enabled = true

[console.customer_data_profiles.scopes]
feature = ["console:customerData"]
read = ["internal_cds_admin_config_view", "internal_cds_profile_view"]
create = ["internal_cds_profile_create"]
update = ["internal_cds_admin_config_update", "internal_cds_profile_update"]
delete = ["internal_cds_profile_delete"]

[console.customer_data_profile_attributes]
enabled = true

[console.customer_data_profile_attributes.scopes]
feature = ["console:customerData"]
read = ["internal_cds_profile_schema_view", "internal_cds_profile_view"]
create = ["internal_cds_profile_schema_create"]
update = ["internal_cds_profile_schema_update", "internal_cds_profile_update"]
delete = ["internal_cds_profile_schema_delete"]

[console.customer_data_unification_rules]
enabled = true

[console.customer_data_unification_rules.scopes]
feature = ["console:customerData"]
read = ["internal_cds_admin_config_view", "internal_cds_unification_rule_view"]
create = ["internal_cds_unification_rule_create"]
update = ["internal_cds_admin_config_update", "internal_cds_unification_rule_update"]
delete = ["internal_cds_unification_rule_delete"]

${TOML_END}
