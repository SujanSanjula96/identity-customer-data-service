${TOML_BEGIN}

# --- The CDS service IS talks to ------------------------------------------- #
# Read by the org.wso2.identity.customer.data.service.* bundles in dropins.
# admin_username/admin_password are the Basic-auth credentials IS presents to
# the CDS sync endpoints; they must match auth_server.admin_* in the CDS
# deployment.yaml.
[customer_data_service]
enable = true
server_url = "${CDS_BASE}"
admin_username = "${CDS_SYNC_USER}"
admin_password = "${CDS_SYNC_PASS}"

# --- Event handlers -------------------------------------------------------- #
# Without these subscriptions AbstractEventHandler.canHandle() returns false and
# the deployed bundles never receive an event.
[[event_handler]]
name = "cds.identity.event.handler"
subscriptions = ["POST_ADD_USER", "POST_SET_USER_CLAIM_VALUE_WITH_ID", "POST_SET_USER_CLAIM_VALUES_WITH_ID", "POST_DELETE_USER_WITH_ID"]

[[event_handler]]
name = "cds.claim.event.handler"
subscriptions = ["POST_LOCAL_CLAIM_ADD", "POST_UPDATE_LOCAL_CLAIM", "POST_DELETE_LOCAL_CLAIM", "POST_ADD_EXTERNAL_CLAIM", "POST_UPDATE_EXTERNAL_CLAIM", "POST_DELETE_EXTERNAL_CLAIM"]

[[event_handler]]
name = "cds.authentication.listener"
subscriptions = ["SESSION_TERMINATE", "AUTHENTICATION_SUCCESS"]

# B2B: org lifecycle events, so that CDS provisions new sub organizations.
[[event_handler]]
name = "cds.organization.event.handler"
subscriptions = ["POST_ADD_ORGANIZATION", "POST_UPDATE_ORGANIZATION", "POST_PATCH_ORGANIZATION", "POST_DELETE_ORGANIZATION"]

# --- Console feature scopes ------------------------------------------------ #
[[api_resources]]
name = "Customer Data Service Feature"
identifier = "console:customerData"
requiresAuthorization = true
description = "Resource representation of the CDS feature"
type = "CONSOLE_FEATURE"

[[api_resources.scopes]]
name = "console:customerData"
displayName = "Customer Data Service Feature"
description = "Manage Customer Data Service from the Console"

[[api_resources.scopes]]
name = "console:customerData_view"
displayName = "Customer Data Service View Feature"
description = "View Customer Data Service from the Console"

[[api_resources.scopes]]
name = "console:customerData_edit"
displayName = "Customer Data Service Edit Feature"
description = "Edit Customer Data Service from the Console"

