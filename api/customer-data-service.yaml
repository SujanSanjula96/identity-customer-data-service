  /unification-rules/options:
    get:
      tags: [Unification Rules]
      summary: Get the attribute types and matching methods that a rule can use
      description: |
        <b>Scope required:</b> `unification_rules:view`
      operationId: getUnificationOptions
      responses:
        '200':
          description: The attribute types, each with the matching methods it supports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnificationOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /unification-rules:
    post:
      tags: [Unification Rules]
      summary: Add new unification rule
      description: |
        Fields that are not part of the request
        schema are rejected with a 400.

        The call returns a 400 when:
        - `property_name` is `user_id` or `identity_attributes.user_id`, starts with
          `application_data.`, is not in the profile schema, or is a complex attribute
        - `unification_method` is `fuzzy` and `attribute_type` is missing
        - `unification_method` is `fuzzy` and the attribute type does not support it
        - `unification_method` is `fuzzy` and the server has
          `identity_resolution.fuzzy_matching_enabled` turned off
        - `match_strength` or `mismatch_strength` is set and the server has
          `identity_resolution.allow_evidence_strength_override` turned off
        - `attribute_type`, `unification_method`, `match_strength` or `mismatch_strength` has a
          value outside its list

        <br><b>Scope required:</b> `unification_rules:create`
      operationId: addUnificationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnificationRuleRequest'
      responses:
        '201':
          description: Unification rule added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnificationRule'
        '400':
          $ref: '#/components/responses/InvalidRequestAnyFormat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Unification Rules]
      summary: Get all unification rules
      description: |
        The list holds the rules of the
        organization and the rules that a parent organization shares with it. The response is a
        plain array, without pagination.

        <br><b>Scope required:</b> `unification_rules:view`
      operationId: getUnificationRules
      responses:
        '200':
          description: Unification rules retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /unification-rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [Unification Rules]
      summary: Get unification rule by ID
      description: |
        <b>Scope required:</b> `unification_rules:view`
      operationId: getUnificationRule
      responses:
        '200':
          description: Unification rule retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Unification Rules]
      summary: Update unification rule
      description: |
        Only the fields in the body change.
        `property_name` cannot be changed. Fields that are not part of the request schema are
        rejected with a 400.

        Only a rule that the organization owns can change. A rule that a parent organization
        shares (`origin` is `SHARED`) is read-only and gives a 403.

        The 400 cases of `POST /unification-rules` that concern `attribute_type`,
        `unification_method` and the evidence strengths apply here, checked against the rule as
        it will be after the change.

        <br><b>Scope required:</b> `unification_rules:update`
      operationId: patchUnificationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnificationRulePatch'
      responses:
        '200':
          description: Unification rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnificationRule'
        '400':
          $ref: '#/components/responses/InvalidRequestAnyFormat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Unification Rules]
      summary: Delete unification rule
      description: |
        Only a rule that the organization owns
        can be deleted; a shared rule gives a 403.

        The call is idempotent: deleting a rule that does not exist also returns a 204.

        <br><b>Scope required:</b> `unification_rules:delete`
      operationId: deleteUnificationRule
      responses:
        '204':
          description: Rule deleted successfully, or it did not exist.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

