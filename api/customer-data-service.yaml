  /identity-resolution/review-tasks:
    get:
      tags: [Identity Resolution]
      summary: List the pending review tasks
      description: |
        A review task is a pair of profiles that
        the identity resolution engine held back from an automatic merge. Only pending tasks are
        listed.

        <br><b>Scope required:</b> `identity_resolution:view`
      operationId: getReviewTasks
      parameters:
        - name: page_size
          in: query
          required: false
          description: Maximum number of tasks to return. Defaults to 5, with a maximum of 200.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 5
        - name: profile_id
          in: query
          required: false
          description: Return only the tasks that involve this profile.
          schema:
            type: string
      responses:
        '200':
          description: A page of review tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /identity-resolution/review-tasks/{taskId}/resolve:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Identity Resolution]
      summary: Approve or reject a review task
      description: |
        Approving merges the two profiles.
        Rejecting keeps them apart.

        <br><b>Scope required:</b> `identity_resolution:update`
      operationId: resolveReviewTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewResolveRequest'
      responses:
        '200':
          description: The task was resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Review task 5af4235d approved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict. The task is already resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
