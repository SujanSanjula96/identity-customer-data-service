openapi: 3.0.0
info:
  title: Custodian API
  description: |-
    This document defines the **Customer Data Service REST API (v1)**.
    It enables organization administrators and applications to:
    - Create, retrieve, update, delete and link customer profiles, and read or update their consents.
    - Define the profile schema: the identity attributes, traits and application data a profile can hold.
    - Configure the unification rules that decide when two profiles belong to the same person.
    - Review and resolve the profile merges that identity resolution held back.
    - Manage consent categories and the attributes each category covers.
    - Configure the service for an organization.
    - Share schema attributes and unification rules with child organizations, and select which
      child organizations can use the service.
  version: 0.0.1
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: https://{server-url}/t/{org-handle}/cds/api/v1
    variables:
      server-url:
        default: localhost:8080
      org-handle:
        default: carbon.super

security:
  - bearerAuth: [ ]

paths:
  /profiles:
    get:
      tags: [Profile]
      summary: Get all profiles
      description: |
        Lists profiles, optionally narrowed by `filter`, by `fuzzyFilter`, or by both.

        `filter` selects profiles whose values satisfy the condition exactly.
        `fuzzyFilter` runs the identity resolution engine instead, returning profiles whose
        values are *similar* to the ones given, each with the score it was given.

        Supplying both is a hybrid search: a profile is returned only where it is similar on
        the `fuzzyFilter` values **and** exactly satisfies every `filter` condition.
        
        <br><b>Scope required:</b> `profile:view`
      operationId: getAllProfiles
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            An exact condition, written `<key> <operator> <value>`. Repeat the parameter to
            apply more than one condition, or join several in one value with ` and `.

            Operators are `eq` (equals), `co` (contains) and `sw` (starts with).
          schema:
            type: array
            items:
              type: string
          example: ["traits.city eq Colombo"]
        - name: fuzzyFilter
          in: query
          required: false
          description: |
            A value to match on similarity rather than equality, written the same way and
            always compared with `eq` — for example `traits.name eq Jonathan Smith`, which
            also matches `Jonathon Smyth`. Repeat the parameter to search on more than one
            attribute.

            How closely two values have to agree is decided by the organisation's active
            unification rules: an attribute is only searched where a rule names it, and the
            rule's attribute type selects the comparison. A rule matched exactly contributes
            nothing extra here, so tolerant search needs at least one rule set to `fuzzy`.

            Tolerant matching has to be switched on for the server
            (`identity_resolution.fuzzy_matching_enabled`). While it is off, rules stored as
            fuzzy are read as exact and this parameter returns only exact matches.
          schema:
            type: array
            items:
              type: string
          example: ["traits.name eq Jonathan Smith"]
        - name: threshold
          in: query
          required: false
          description: |
            Lowest match score to return, between 0 and 1. Only applies alongside
            `fuzzyFilter`. Omitted, every scored candidate is returned.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
          example: 0.75
        - name: page_size
          in: query
          required: false
          description: |
            Maximum number of profiles to return. Defaults to 5, with a maximum of 200.
            A value that is not a valid number, or is out of range, gives a 400.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 5
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor from `next_cursor` or `previous_cursor` of a previous page. Used
            with or without `filter`. Ignored by a `fuzzyFilter` search. An invalid cursor
            gives a 400.
          schema:
            type: string
        - name: attributes
          in: query
          required: false
          description: |
            Comma-separated list of the fields to return in each profile, for example
            `traits.city,identity_attributes`. A name with a dot selects one attribute of a
            scope; a scope alone selects all of its attributes.
          schema:
            type: string
          example: "traits.city,identity_attributes"
      responses:
        '200':
          description: |
            A page of profiles. Where `fuzzyFilter` was supplied each profile also carries
            `match_score` and `score_breakdown`, highest score first, and `pagination`
            holds only `count` and `page_size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListAPIResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Profile]
      summary: Create a profile
      description: |
        Creates a profile and sets the `cds_profile` cookie that tracks it as an anonymous
        profile.
        If the request carries a `cds_profile` cookie that belongs to an active profile, no
        profile is created and the existing profile is returned with a 200.

        Fields that are not part of the request schema are rejected with a 400.

        <br><b>Scope required:</b> `profile:create`
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: A valid `cds_profile` cookie was sent, so the existing profile is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '201':
          description: Profile created.
          headers:
            Location:
              description: URL of the new profile.
              schema:
                type: string
            Set-Cookie:
              description: The `cds_profile` cookie (HttpOnly) that identifies the anonymous profile.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/Me:
    get:
      tags: [Profile]
      summary: Retrieve the current user's profile
      description: |
        The profile is resolved from the `cds_profile` cookie when it belongs to an active
        profile. Otherwise it is resolved from the `sub` claim of the bearer token, which is
        matched against the profile's `user_id`.

        <br><b>Scope required:</b> `profile:view`
      operationId: getCurrentUserProfile
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Unauthorized. The token is invalid or has no usable `sub` claim, or the credentials
            are not valid for the organization. Some of these responses have a plain text body
            instead of an `Error`.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Profile]
      summary: Update the current user's profile
      description: |
        Updates the profile of the current user. The profile is resolved as for `GET /profiles/Me`.

        <br><b>Scope required:</b> `profile:update`
      operationId: patchCurrentUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Unauthorized. No profile can be resolved from the cookie or the token, the token is
            invalid, or the credentials are not valid for the organization. Some of these
            responses have a plain text body instead of an `Error`.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/sync:
    post:
      tags: [Profile]
      summary: Sync a profile from an identity server event
      description: |
        Called by the identity server when a user is added, deleted or changed. Uses the
        admin credentials (HTTP Basic) instead of a bearer token, and the organization comes
        from `orgHandle` in the body, not from the path.
      operationId: syncProfile
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSyncRequest'
      responses:
        '200':
          description: |
            The event was processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
        '400':
          description: |
            Bad Request. The body is invalid, `orgHandle` is missing, or CDS is not enabled for
            the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/link:
    post:
      tags: [Profile]
      summary: Link an anonymous profile to a user
      description: |
        Sets the `user_id` of an anonymous profile.
        The call is idempotent: linking a profile to the user it is already linked to returns
        a 200 with no change.

        <br><b>Scope required:</b> `profile:link`
      operationId: linkProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileLinkRequest'
      responses:
        '200':
          description: Profile linked successfully, or it was already linked to this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLinkResponse'
        '400':
          description: |
            Bad Request. The body is invalid, `profile_id` or `user_id` is missing, or CDS is not
            enabled for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '409':
          description: Conflict. The profile is already linked to a different user (`PROFILE_ALREADY_LINKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Profile]
      summary: Retrieve profile by Id
      description: |
        Unless the caller is a system application, the profile is filtered by consent: only
        the attributes covered by a consent the profile has given are returned. Use
        `consentCategoryId` to limit this to specific consent categories.

        <br><b>Scope required:</b> `profile:view`
      operationId: getProfile
      parameters:
        - name: includeApplicationData
          in: query
          required: false
          description: Whether to include `application_data` in the response.
          schema:
            type: boolean
            default: true
        - name: application_identifier
          in: query
          required: false
          description: |
            Application identifiers whose `application_data` is returned, comma-separated or
            repeated. Use `*` for all applications.
          schema:
            type: string
          example: "app-1,app-2"
        - name: consentCategoryId
          in: query
          required: false
          description: |
            Consent categories to filter the response by, comma-separated or repeated. Not used
            for a system application.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Profile]
      summary: Update profile by Id
      description: |
        Partially updates a profile.
        `identity_attributes`, `traits` and `application_data` in the body are deep merged
        into the existing values. If the profile has been merged into another profile, the
        patch is applied to that profile's data.

        <br><b>Scope required:</b> `profile:update`
      operationId: patchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profile]
      summary: Delete profile by Id
      description: |
        <b>Scope required:</b> `profile:delete`
      operationId: deleteProfile
      responses:
        '204':
          description: Profile deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/{profileId}/consents:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Profile]
      summary: Get the consents of a profile
      description: |
        <b>Scope required:</b> `profile:view`
      operationId: getProfileConsents
      responses:
        '200':
          description: The consent records of the profile.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Profile]
      summary: Update the consents of a profile
      description: |
        <b>Scope required:</b> `profile:update`
      operationId: updateProfileConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ConsentRecord'
      responses:
        '200':
          description: Consents updated. The body echoes the records that were sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        '400':
          description: |
            Bad Request. The body is not a valid array of consent records (this response can have
            a plain text body), or CDS is not enabled for the organization.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile-schema:
    get:
      tags: [Profile Schema]
      summary: Get the whole profile schema
      description: |
        <b>Scope required:</b> `profile_schema:view`
      operationId: getProfileSchema
      responses:
        '200':
          description: The profile schema of the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profile Schema]
      summary: Delete the whole profile schema
      description: |
        <b>Scope required:</b> `profile_schema:delete`
      operationId: deleteProfileSchema
      responses:
        '204':
          description: Profile schema deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile-schema/sync:
    post:
      tags: [Profile Schema]
      summary: Sync the profile schema from an identity server event
      description: |
        Called by the identity server when a claim is added, changed or deleted. Uses the admin
        credentials (HTTP Basic) instead of a bearer token, and the organization comes from
        `orgHandle` in the body, not from the path.

        The request is queued and processed in the background. It is refused for an
        organization that inherits its identity attributes from another organization.
      operationId: syncProfileSchema
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSchemaSyncRequest'
      responses:
        '200':
          description: The sync request was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Profile schema sync request accepted for processing.
        '400':
          description: |
            Bad Request. The body is invalid, `orgHandle` is missing, CDS is not enabled for the
            organization, or the organization inherits its identity attributes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not Found. The `event` is not a known sync event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Unknown sync event.
        '500':
          description: Internal Server Error. The sync request could not be queued, for example because the queue is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /profile-schema/{scope}:
    parameters:
      - $ref: '#/components/parameters/Scope'
    get:
      tags: [Profile Schema]
      summary: Get the schema attributes of a scope
      description: |
        <b>Scope required:</b> `profile_schema:view`
      operationId: getProfileSchemaForScope
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            A condition, written `<key> <operator> <value>`, for example
            `application_identifier eq app-1`. Repeat the parameter, or join conditions with
            ` and `. The keys are `attribute_name` and `application_identifier`.
          schema:
            type: array
            items:
              type: string
          example: ["application_identifier eq app-1"]
      responses:
        '200':
          description: |
            The attributes of the scope. For `application_data` the attributes of all
            applications are returned unless a filter narrows them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Profile Schema]
      summary: Add schema attributes to a scope
      description: |
        The body is an **array**, so one call can add
        several attributes. Fields that are not part of the attribute schema are rejected.

        The call returns a 400 when the array is empty, when the scope is `identity_attributes`
        (those are managed in the identity provider), or when an attribute sets
        `application_identifier` in a scope other than `application_data`.

        `attribute_id` is generated when omitted, and `mutability` defaults to `readWrite`.

        <br><b>Scope required:</b> `profile_schema:create`
      operationId: addProfileSchemaAttributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
      responses:
        '201':
          description: The attributes that were created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          description: |
            Bad Request. The body is invalid or empty, the scope is `identity_attributes` or not
            a valid scope, or `application_identifier` is used outside `application_data`. This
            response uses either form of error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict. An attribute conflicts with one that already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profile Schema]
      summary: Delete all schema attributes of a scope
      description: |
        Not allowed for `identity_attributes`, which
        returns a 405.

        <br><b>Scope required:</b> `profile_schema:delete`
      operationId: deleteProfileSchemaForScope
      responses:
        '204':
          description: Attributes deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method Not Allowed. The scope is `identity_attributes`, whose attributes are managed in the identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile-schema/{scope}/{attrID}:
    parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/AttributeId'
    get:
      tags: [Profile Schema]
      summary: Get a schema attribute
      description: |
        <b>Scope required:</b> `profile_schema:view`
      operationId: getProfileSchemaAttribute
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Profile Schema]
      summary: Update a schema attribute
      description: |
        Despite the method, this is a **partial
        update**: only the fields in the body change. The body is any JSON object of attribute
        fields.

        Not allowed for `identity_attributes`, which returns a 400.

        <br><b>Scope required:</b> `profile_schema:update`
      operationId: updateProfileSchemaAttribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The attribute fields to change.
              example:
                display_name: Preferred city
      responses:
        '200':
          description: The attribute after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          description: |
            Bad Request. The body is not valid (this response can have a plain text body), the
            scope is `identity_attributes` or not a valid scope, or CDS is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profile Schema]
      summary: Delete a schema attribute
      description: |
        The call is idempotent: deleting an attribute that does not exist also returns a 204.
        A shared or inherited attribute is read-only and gives a 403. An attribute that is a
        sub-attribute of another attribute cannot be deleted until it is removed from its
        parent, which gives a 400.

        <br><b>Scope required:</b> `profile_schema:delete`
      operationId: deleteProfileSchemaAttribute
      responses:
        '204':
          description: Attribute deleted, or it did not exist.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile-schema/{scope}/{attrID}/sharing-policies:
    parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/AttributeId'
    post:
      tags: [Sharing]
      summary: Share a profile schema attribute with child organizations
      description: |
        Only the organization that owns the attribute can share it. Identity attributes, complex
        attributes, and sub-attributes cannot be shared. An organization has a maximum of one policy
