env: "${ENV}" # This will be replaced by the ENV variable

log:
  # Default outputs for all log types. A log type can override each key in its own block.
  outputs:
    console:
      enabled: true
      format: "text"           # "text" or "json"
    file:
      enabled: false
      format: "json"           # "text" or "json"
      dir: "repository/logs"   # Relative to CDS_HOME unless absolute
      max_size_mb: 10          # A file also rotates each day
      max_backups: 20          # Rotated files to keep for each log type
  # Application log: what the server and its workers do.
  app:
    level: "${LOG_LEVEL}"
    #    - "INFO", "WARN", "ERROR", "DEBUG" - and environment specific log level
    outputs:
      file:
        name: "cds.log"
  # Access log: one record for each HTTP request.
  access:
    enabled: true
    outputs:
      file:
        name: "http_access.log"
  # Audit log: who did what to which resource, with what outcome. The records are always JSON.
  audit:
    enabled: true
    outputs:
      file:
        name: "audit.log"

auth:
  # Browser origins allowed on every request, for the apps every organisation uses, such as
  # the Console and My Account. An organisation adds the origins of its own apps through
  # cors_allowed_origins in the admin configuration API, and those apply to its requests only.
  cors_allowed_origins:
    - "https://localhost:9443"

addr:
  host: 127.0.0.1
  port: 8900

# The endpoints only the Identity Server calls, on a port of their own that is never exposed with the
# public APIs. Without sync.addr they are served on addr. See the security README.
# The Identity Server sends them to [customer_data_service] sync_url: point it at sync.addr.
sync:
  addr:
    host: 127.0.0.1
    port: 8901
  require_client_cert: false                    # require a client certificate in the TLS handshake
  client_trust_store: "client_trust_store.pem"  # the client certificates the sync port accepts

server_url: "https://localhost:8900" # Public-facing base URL used for constructing Location headers

# How CDS identifies an application, in system_applications and in application data:
# "app_id" is the Identity Server application ID, "client_id" its OAuth client ID.
# The Console has to use the same, so it must match cds_application_identifier_type
# in the Identity Server's Console configuration.
application_identifier_type: "app_id"

# The identity provider of this deployment: wso2is (default). One CDS deployment works with one
# identity provider.
idp:
  type: "wso2is"
  # The service-to-service credentials CDS calls the identity provider with, one
  # pair per organization. The Identity Server creates an application for each
  # organization as it enables CDS and sends the credentials to CDS, which keeps
  # them in its database.
  #
  # encryption_key seals those client secrets at rest. Without it CDS refuses
  # them, and needs a client pair of its own under auth_server (client_id,
  # client_secret, introspection_client_id, introspection_client_secret), which
  # this configuration does not set. Generate one with
  # `openssl rand -base64 32`; a key that is set but not usable stops the server.
  # Only for an identity provider that sends service credentials (wso2is); a key
  # for any other stops the server.
  #
  # introspection_auth: "bearer_token" (default) or "client_secret_basic" (for an
  # Identity Server that accepts client authentication at introspection).
  service_credentials:
    encryption_key: "${SERVICE_CREDENTIALS_ENCRYPTION_KEY}"
    introspection_auth: "bearer_token"

# Organization management: the organization tree, sub organization paths, and sharing with child
# organizations. On in this shipped configuration: every database script and the inbuilt database
# create the organization tables.
organization_management:
  enabled: true

auth_server:
  host: "localhost"
  port : 9443
  adu_is_hostname : "localhost"
  cookieDomain: "localhost"
  introspectionEndpoint: "/oauth2/introspect"
  tokenEndpoint: "/oauth2/token"
  jwksEndpoint: "/oauth2/jwks"
  admin_username: "admin"
  admin_password: "${AUTH_SERVER_ADMIN_PASSWORD}"
  isSystemAppGrantEnabled: false
  required_scopes:
    profile:create:
      - "internal_cds_profile_create"
    profile:update:
      - "internal_cds_profile_update"
    profile:view:
      - "internal_cds_profile_view"
    profile:delete:
      - "internal_cds_profile_delete"
    profile:link:
      - "internal_cds_profile_link"

    unification_rules:view:
      - "internal_cds_unification_rule_view"
    unification_rules:create:
      - "internal_cds_unification_rule_create"
    unification_rules:update:
      - "internal_cds_unification_rule_update"
    unification_rules:delete:
      - "internal_cds_unification_rule_delete"
    unification_rules:share_view:
      - "internal_cds_unification_rule_share_view"
    unification_rules:share_update:
      - "internal_cds_unification_rule_share_update"

    profile_schema:view:
      - "internal_cds_profile_schema_view"
    profile_schema:create:
      - "internal_cds_profile_schema_create"
    profile_schema:update:
      - "internal_cds_profile_schema_update"
    profile_schema:delete:
      - "internal_cds_profile_schema_delete"
    profile_schema:share_view:
      - "internal_cds_profile_schema_share_view"
    profile_schema:share_update:
      - "internal_cds_profile_schema_share_update"

    admin_config:view:
      - "internal_cds_admin_config_view"
    admin_config:update:
      - "internal_cds_admin_config_update"
    organization:view:
      - "internal_cds_organization_view"
    organization:update:
      - "internal_cds_organization_update"

    consent_category:view:
      - "internal_cds_consent_category_view"
    consent_category:create:
      - "internal_cds_consent_category_create"
    consent_category:update:
      - "internal_cds_consent_category_update"
    consent_category:delete:
      - "internal_cds_consent_category_delete"
    identity_resolution:view:
      - "internal_cds_identity_resolution_view"
    identity_resolution:update:
      - "internal_cds_identity_resolution_update"

    org:profile:create:
      - "internal_org_cds_profile_create"
    org:profile:update:
      - "internal_org_cds_profile_update"
    org:profile:view:
      - "internal_org_cds_profile_view"
    org:profile:delete:
      - "internal_org_cds_profile_delete"
    org:profile:link:
      - "internal_org_cds_profile_link"

    org:unification_rules:view:
      - "internal_org_cds_unification_rule_view"

    org:profile_schema:view:
      - "internal_org_cds_profile_schema_view"

    org:admin_config:view:
      - "internal_org_cds_admin_config_view"

    org:consent_category:view:
      - "internal_org_cds_consent_category_view"

    org:identity_resolution:view:
      - "internal_org_cds_identity_resolution_view"
    org:identity_resolution:update:
      - "internal_org_cds_identity_resolution_update"

cleanup:
  cookie:
    enabled: true
    interval: 86400    # in seconds (24 hours)
    batch_size: 500

# Maximum time allowed for the complete graceful shutdown: the HTTP server, the
# workers, the message queue and the database pool. Keep it below the Kubernetes
# terminationGracePeriodSeconds of the pod. Zero means "use the default".
shutdown:
  grace_period_seconds: 25

# Message queue configuration.
# Set type to "activemq" to use an external ActiveMQ broker for durable
# message delivery. Leave type as "memory" (or omit the block entirely) to
# use the built-in in-memory queue, which is the default and is suitable
# for local and single-instance deployments.
message_queue:
  type: "memory" # Options: "memory" (default), "activemq", or any registered custom provider
  broker:
    addr: ""               # Broker endpoint (host:port)
    username: "admin"
    password: "${BROKER_PASSWORD}"
    profile_queue_name: "/queue/cds-profile-unification"
    schema_sync_queue_name: "/queue/cds-schema-sync"

# Datasource configuration.
# Use "sqlite" for the inbuilt database, which needs no external server, and
# "postgres", "mysql", "mssql" or "oracle" for production. An unset type means "sqlite".
datasource:
  type: "postgres"
  hostname: "localhost"
  port: 5432
  username: "postgres"
  password: "${DB_PASSWORD}"
  name: "cds_db"
  sslmode: disable
  # Applies only when type is "postgres". The values are per instance, because
  # one instance holds one pool. Omit a setting, or set it to zero, to use the
  # application default. A negative value is refused at start.
  # postgres:
  #   max_open_conns: 100             # connections held, in use and idle together
  #   max_idle_conns: 25              # unused connections kept open
  #   conn_max_lifetime_seconds: 1800 # retire a connection at this age
  #   conn_max_idle_time_seconds: 300 # close a connection unused this long
  #   connect_timeout_seconds: 10     # bound one connection attempt, handshake included
  # Applies only when type is "mysql". The same settings as postgres, with the
  # same defaults. For mysql, sslmode is disable, require, verify-ca or verify-full.
  # mysql:
  #   max_open_conns: 100
  #   max_idle_conns: 25
  #   conn_max_lifetime_seconds: 1800
  #   conn_max_idle_time_seconds: 300
  #   connect_timeout_seconds: 10
  # Applies only when type is "mssql". The same settings as postgres, with the
  # same defaults. For mssql, sslmode is disable, require, verify-ca or verify-full.
  # mssql:
  #   max_open_conns: 100
  #   max_idle_conns: 25
  #   conn_max_lifetime_seconds: 1800
  #   conn_max_idle_time_seconds: 300
  #   connect_timeout_seconds: 10
  # Applies only when type is "oracle". The same settings as postgres, with the
  # same defaults. For oracle, name is the service name of the pluggable database,
  # and sslmode is disable, require, verify-ca or verify-full.
  # oracle:
  #   max_open_conns: 100
  #   max_idle_conns: 25
  #   conn_max_lifetime_seconds: 1800
  #   conn_max_idle_time_seconds: 300
  #   connect_timeout_seconds: 10
  # Applies only when type is "sqlite". Zero means the application default.
  # sqlite:
  #   path: "repository/database/cds.db" # Relative to the CDS home directory
  #   options: ""                        # DSN options
  #   max_open_conns: 4

tls:
  mtls_enabled: false   # present server_cert as a client certificate when calling the Identity Server
  cert_dir: "/etc/certs"
  server_cert: "server.crt"
  server_key: "server.key"
  trust_store: "trust_store.pem"   # Identity Server certificates CDD trusts, besides the system CAs

identity_resolution:
  # Allow a unification rule to carry its own match_strength and mismatch_strength rather
  # than taking the values derived from its attribute_type. Off until operators have a way
  # to preview what a change would do to existing profiles.
  allow_evidence_strength_override: false

  # Tolerant matching, server-wide. On in this shipped configuration, so a new deployment
  # can create fuzzy rules and the Console's tolerant matching controls work out of the box.
  # A deployment.yaml without this key keeps it off, so an upgrade that keeps its own
  # configuration unifies profiles exactly as it did. While it is off new fuzzy rules are
  # refused and any already stored are evaluated as exact.
  fuzzy_matching_enabled: true

  # How many queued profiles this instance unifies at the same time. Matching runs in
  # parallel, and two merges that share a profile wait for each other. Each worker holds
  # at most one database connection at a time. When the key is absent, 5, or 1 on the
  # inbuilt SQLite database, which takes one writer at a time.
  # unification_workers: 5
