env: "${ENV}" # This will be replaced by the ENV variable

log:
  log_level: "${LOG_LEVEL}"
  #    - "INFO", "WARN", "ERROR", "DEBUG" - and environment specific log level


cache:
  enabled: true
  default_cache_timeout: 15


auth:
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "https://localhost:9001"
    - "https://localhost:9443"

addr:
  host: 127.0.0.1
  port: 8900

server_url: "https://localhost:8900" # Public-facing base URL used for constructing Location headers

auth_server:
  host: "localhost"
  port : 9443
  adu_is_hostname : "localhost"
  cookieDomain: "localhost"
  introspectionEndpoint: "/oauth2/introspect"
  tokenEndpoint: "/oauth2/token"
  revocationEndpoint: "/oauth2/revoke"
  claimsEndpoint: "api/server/v1/claim-dialects"
  client_id: "A5XX_NeBFi6Cf_4Zkn551xTdXnAa"
  client_secret: "${AUTH_SERVER_CLIENT_SECRET}"
  admin_username: "admin"
  admin_password: "${AUTH_SERVER_ADMIN_PASSWORD}"
  isSystemAppGrantEnabled: false
  introspection_client_id : "cds_introspection_client"
  introspection_client_secret: "${INTROSPECTION_CLIENT_SECRET}"
  # B2B: a token of a sub organization carries the organization form of each scope.
  org_scope_prefix:
    "internal_": "internal_org_"
  required_scopes:
    profile:create:
      - "internal_cds_profile_create"
    profile:update:
      - "internal_cds_profile_update"
    profile:view:
      - "internal_cds_profile_view"
    profile:delete:
      - "internal_cds_profile_delete"
    profile:link:
      - "internal_cds_profile_link"

    unification_rules:view:
      - "internal_cds_unification_rule_view"
    unification_rules:create:
      - "internal_cds_unification_rule_create"
    unification_rules:update:
      - "internal_cds_unification_rule_update"
    unification_rules:delete:
      - "internal_cds_unification_rule_delete"
    unification_rules:share:
      - "internal_cds_unification_rule_update"

    profile_schema:view:
      - "internal_cds_profile_schema_view"
    profile_schema:create:
      - "internal_cds_profile_schema_create"
    profile_schema:update:
      - "internal_cds_profile_schema_update"
    profile_schema:delete:
      - "internal_cds_profile_schema_delete"
    # B2B: share a schema attribute or a unification rule with child organizations.
    profile_schema:share:
      - "internal_cds_profile_schema_update"

    admin_config:view:
      - "internal_cds_admin_config_view"
    admin_config:update:
      - "internal_cds_admin_config_update"

    consent_category:view:
      - "internal_cds_consent_category_view"
    consent_category:create:
      - "internal_cds_consent_category_create"
    consent_category:update:
      - "internal_cds_consent_category_update"
    consent_category:delete:
      - "internal_cds_consent_category_delete"


sync:
  schema:
    enabled: true
    interval: 3600 # in seconds

cleanup:
  cookie:
    enabled: true
    interval: 86400    # in seconds (24 hours)
    batch_size: 500

# Maximum time allowed for the complete graceful shutdown: the HTTP server, the
# workers, the message queue and the database pool. Keep it below the Kubernetes
# terminationGracePeriodSeconds of the pod. Zero means "use the default".
shutdown:
  grace_period_seconds: 25

# Message queue configuration.
# Set type to "activemq" to use an external ActiveMQ broker for durable
# message delivery. Leave type as "memory" (or omit the block entirely) to
# use the built-in in-memory queue, which is the default and is suitable
# for local and single-instance deployments.
message_queue:
  type: "memory" # Options: "memory" (default), "activemq", or any registered custom provider
  broker:
    addr: ""               # Broker endpoint (host:port)
    username: "admin"
    password: "${BROKER_PASSWORD}"
    profile_queue_name: "/queue/cds-profile-unification"
    schema_sync_queue_name: "/queue/cds-schema-sync"

# Datasource configuration.
# Use "sqlite" for the inbuilt database, which needs no external server, and
# "postgres" for production. An unset type means "sqlite".
datasource:
  type: "postgres"
  hostname: "localhost"
  port: 5432
  username: "postgres"
  password: "${DB_PASSWORD}"
  name: "cds_db"
  sslmode: disable
  # Applies only when type is "postgres". The values are per instance, because
  # one instance holds one pool. Omit a setting, or set it to zero, to use the
  # application default. A negative value is refused at start.
  # postgres:
  #   max_open_conns: 100             # connections held, in use and idle together
  #   max_idle_conns: 25              # unused connections kept open
  #   conn_max_lifetime_seconds: 1800 # retire a connection at this age
  #   conn_max_idle_time_seconds: 300 # close a connection unused this long
  #   connect_timeout_seconds: 10     # bound one connection attempt, handshake included
  # Applies only when type is "sqlite". Zero means the application default.
  # sqlite:
  #   path: "repository/database/cds.db" # Relative to the CDS home directory
  #   options: ""                        # DSN options
  #   max_open_conns: 4

tls:
  mtls_enabled: true
  cert_dir: "/etc/certs"
  server_cert: "server.crt" #filename
  server_key: "server.key" #filename
  client_cert: "client.crt"   #filename
  trust_store: "trust_store.pem"      #filename
