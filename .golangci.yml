version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gocritic:
      disabled-checks:
        - exitAfterDefer
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
    goconst:
      exclude-types:
        - Call
        - CompositeLit
    gosec:
      excludes:
        - G117
        - G124
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    revive:
      rules:
        - name: struct-tag
          arguments:
            - json,inline
        - name: var-naming
        - name: redundant-import-alias
        - name: comment-spacings
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
    staticcheck:
      checks:
        - all
        - -QF1008
        - -QF1011
        - -ST1003
        - -ST1012
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        text: G101
        linters:
          - gosec
      # Findings in code that predates the lint clean-up and would need logic changes to clear.
      # Scoped to the affected files or functions, so the checks still apply everywhere else.
      # Hash and phonetic arithmetic converts within known bounds.
      - path: internal/identity_resolution/engine/algorithms/(locality_sensitive_hash|phonetic)\.go
        text: G115
        linters:
          - gosec
      # The signal list is indexed only after its length is checked.
      - path: (cmd/server|internal/system/server)/shutdown\.go
        text: G602
        linters:
          - gosec
      # A fixed seed keeps the test reproducible; nothing here needs cryptographic randomness.
      - path: internal/identity_resolution/engine/algorithms/locality_sensitive_hash_test\.go
        text: G404
        linters:
          - gosec
      - path: internal/system/database/scripts/registry_completeness_test\.go
        text: SA1019
        linters:
          - staticcheck
      # Builds a JSON object by hand; %q would change the output for keys with special characters.
      - path: internal/profile/store/profile_store\.go
        text: sprintfQuotedString
        linters:
          - gocritic
      # Returns nil, not an empty slice, when there is no application data to merge.
      - path: internal/system/workers/profile_worker\.go
        linters:
          - prealloc
      - text: of func `(DoubleMetaphone|EvaluateCandidate|\(\*IdentityResolutionService\)\.ResolveReviewTask|ResolveProfileAsync|\(\*ProfileHandler\)\.SyncProfile|FilterProfileByConsent|isValidType|GetAllProfilesWithFilter|GetProfileIDsWithFilters|\(\*ProfileSchemaService\)\.UpdateProfileSchemaAttributeByID|\(\*UnificationRulesHandler\)\.PatchUnificationRule|Test_ProductionProvider)`
        linters:
          - gocyclo
      - path: internal/(consent/store/consent_category_store|profile/store/profile_store|system/queue/activemq/activemq)\.go
        linters:
          - dupl
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wso2/identity-customer-data-service
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
output:
  show-stats: true
