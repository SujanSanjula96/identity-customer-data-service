cloud:
  deployment:
    cds:
      containerPort: 8900
      config:
        env: "dev"
        logLevel: "DEBUG" # Log level: "INFO", "WARN", "ERROR", "DEBUG"
        cache:
          enabled: true
          defaultCacheTimeout: 15
        auth:
          corsAllowedOrigins: []
        addr:
          host: "localhost"
        cleanup:
          cookie:
            enabled: true
            interval: 86400    # in seconds (24 hours)
            batch_size: 500
        shutdown:
          # Bounds the whole graceful shutdown of the application. Keep it below
          # terminationGracePeriodSeconds.
          gracePeriodSeconds: 25
        sync:
          schema:
            enabled: true
            interval: 3600 # in seconds
        # Organization management: the organization tree, sub organization paths, and sharing.
        # Create the organization tables (dbscripts/migrations/002) before you enable it.
        organizationManagement:
          enabled: false
        # The phase of the org handle to org ID migration: dual_write, read_org_id or org_id_only.
        # Move one phase forward at a time, after the schema step that the phase needs. A
        # deployment that upgrades from org handles sets dual_write before the upgrade. Read
        # docs/guides/org-id-migration.md.
        orgIdMigration:
          phase: "org_id_only"
        datasource:
          type: "postgres"
          hostname: "localhost"
          port: 5432
          name: "cds_db"
          sslmode: require
          # Connection pool bounds for one pod.
          postgres:
            maxOpenConns: 100
            maxIdleConns: 25
            connMaxLifetimeSeconds: 1800
            connMaxIdleTimeSeconds: 300
            # Bounds one connection attempt, the startup handshake included,
            # and the check that runs when the pool opens.
            connectTimeoutSeconds: 10

        serverUrl : "http://localhost:8900"

        applicationIdentifierType: "client_id" # Application identifier mode: "client_id" (default) or "app_id"

        organizationManagement:
          enabled: false

        identityServer:
          host: localhost
          port: ""
          ADUISHostname : "identity-server"
          cookieDomain: "localhost"
          introspectionEndpoint: "/oauth2/introspect"
          tokenEndpoint: "/oauth2/token"
          revocationEndpoint: "/oauth2/revoke"
          claimsEndpoint: "api/server/v1/claim-dialects"
          isSystemAppGrantEnabled: true
          certName: "wso2carbontls.cer"

        message_queue:
          type: "memory" # Options: "activemq", "memory"
          broker:
            addr: "localhost"
            profile_queue_name: "/queue/cds-profile-unification"
            schema_sync_queue_name: "/queue/cds-schema-sync"

        identityResolution:
          # Let a unification rule carry its own match_strength and mismatch_strength rather
          # than taking the values derived from its attribute_type. Off until operators have
          # a way to preview what a change would do to existing profiles.
          allowEvidenceStrengthOverride: false
          # Tolerant matching, server-wide. Off by default so an upgrade keeps unifying
          # profiles exactly as it did. While it is off new fuzzy rules are refused and any
          # already stored are evaluated as exact.
          fuzzyMatchingEnabled: false

      tls:
        mtls_enabled: false
        cert_dir : "/app/repository/certs"
        server_cert: "client.cer"
        server_key: "client-key.pem"
        client_cert: "wso2carbontls.cer"
        trust_store: "truststore.pem"

      secrets:
        authServerClientId: "" # Add the auth server client ID
        authServerClientSecret: "" # Add the auth server client secret
        authServerAdminUsername: "" # Add the auth server admin username
        authServerAdminPassword: "" # Add the auth server admin password
        databaseUsername: "" # Add the database admin username
        databasePassword: "" # Add the database admin password
        introspectionClientId: ""
        introspectionClientSecret: "" # Add the introspection client secret
        activemqBrokerUsername: "" # Add the ActiveMQ broker username
        activemqBrokerPassword: "" # Add the ActiveMQ broker password
      replicas: 2
      progressDeadlineSeconds: 300
      minReadySeconds: 30
      # The outer limit Kubernetes allows a pod to stop in. Keep it above
      # config.shutdown.gracePeriodSeconds, so the application has time to
      # finish and exit before SIGKILL.
      terminationGracePeriodSeconds: 30
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      dockerRegistry: ""
      imageName: ""
      digest: ""
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 10
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 10
        # The readiness query runs under the context of the probe request, so
        # this is its only bound. Kubernetes defaults it to one second.
        timeoutSeconds: 5
      imagePullPolicy: Always
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 256Mi
          cpu: 250m
      hpa:
        maxReplicas: 3
        averageUtilizationCPU: 75
        averageUtilizationMemory: 75

  service:
    name: cds-service
    port: 8900
  ingress:
    ratelimit:
      cds:
        zoneName: "customerDataService"
        burstLimit: 50
    hostName: "cds.local.com"
    ingressClassName: "nginx"
