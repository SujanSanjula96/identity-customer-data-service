name: Update CI Pipeline Tag

on:
  workflow_run:
    workflows: ["🚀 CDS Release Builder"]
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: "Manually set released tag name (e.g., v0.9.0)"
        required: false
        type: string

jobs:
  update-ci:
    if: >
      (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Determine tag name
        id: tag
        run: |
          echo "📌 Determining tag name…"

          # Manual trigger case
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "📌 Manual trigger: using provided tag"
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "🔍 Released branch: $BRANCH"

          if [ -z "$BRANCH" ]; then
            echo "❌ ERROR: Could not resolve the released branch"
            exit 1
          fi

          echo "📦 Fetching repository..."
          git clone --quiet https://github.com/${{ github.repository }} repo
          cd repo

          # Must fetch tags
          git fetch --tags --force
          git fetch --quiet origin "$BRANCH"

          # The release builder commits the version bump and then tags it, so the
          # release tag is the newest product tag reachable from the branch tip -
          # not necessarily the commit the release run was dispatched against.
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "origin/$BRANCH" 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "❌ ERROR: No product tag found on branch: $BRANCH"
            exit 1
          fi

          echo "🎯 Tag detected: $TAG"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Skip if helm tag
        if: contains(steps.tag.outputs.TAG_NAME, 'helm')
        run: |
          echo "Skipping because tag contains 'helm': ${{ steps.tag.outputs.TAG_NAME }}"
          exit 0

      - name: Checkout deployment repository
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.DEPLOYMENT_REPOSITORY }}
          token: ${{ secrets.CDS_DEPLOYMENT_PAT }}
          ref: ${{ secrets.DEPLOYMENT_REPOSITORY_CI_BRANCH }}
          path: deployment-repo

      - name: Update CDS_APPLICATION_TAG
        run: |
          cd deployment-repo
          echo "🔧 Updating CDS_APPLICATION_TAG to: ${{ steps.tag.outputs.TAG_NAME }}"

          sed -i \
            "s/CDS_APPLICATION_TAG: .*/CDS_APPLICATION_TAG: \"${{ steps.tag.outputs.TAG_NAME }}\"/" \
            ci-pipelines/cds/setup-variables.yaml

      - name: Commit and push changes
        run: |
          cd deployment-repo
          git config user.name "${{ secrets.IAM_CLOUD_BOT_USERNAME }}"
          git config user.email "${{ secrets.IAM_CLOUD_BOT_EMAIL }}"

          git add ci-pipelines/cds/setup-variables.yaml
          git commit -m "Update CDS_APPLICATION_TAG to ${{ steps.tag.outputs.TAG_NAME }}" || echo "ℹ️ No changes to commit"
          git push origin ${{ secrets.DEPLOYMENT_REPOSITORY_CI_BRANCH }}
