name: PR Builder

on:
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.26.10'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make zip unzip

      - name: Build
        run: make build

      - name: Check the third-party licenses
        run: make check-licenses

      # Cross-compilation and packaging are exercised only here, so a
      # dependency that stops building for one platform, or a pack that loses
      # a file it is meant to ship, is caught on the pull request rather than
      # during a release.
      - name: Build distributions
        run: make dist

      - name: Check the pack contents
        run: distribution/check-pack.sh target/dist

      - name: Summarise the artifacts
        if: always()
        run: distribution/artifact-summary.sh target/dist >> "$GITHUB_STEP_SUMMARY"

      # Rendered here so a change to the release body is reviewed with the
      # change that caused it, and so a broken generator fails on the pull
      # request rather than halfway through a release.
      - name: Preview the release notes
        run: |
          {
            echo "<details><summary>Release notes preview</summary>"
            echo
            distribution/release-notes.sh target/dist
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Checks the header of every source file the pull request adds or changes.
  license-headers:
    name: License headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the license headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-license-headers BASE_REF="$BASE_SHA"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make zip

      - name: Lint
        run: make lint LINT_BASE=${{ github.event.pull_request.base.sha || 'origin/main' }}

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make zip

      - name: Run Integration Tests
        run: make integration-test

  sqlite-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make zip

      - name: Run Unit Tests
        run: make unit-test-coverage

      - name: Add coverage to the job summary
        run: |
          {
            echo '### Unit test coverage'
            echo
            echo "Total: $(tail -n 1 target/coverage/coverage_unit.txt | awk '{print $NF}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test coverage report to Codecov
        uses: codecov/codecov-action@v7
        timeout-minutes: 5
        continue-on-error: true
        with:
          use_oidc: true
          files: target/coverage/coverage_unit.out
          disable_search: true
          flags: backend-unit
          name: Backend Unit Tests
          fail_ci_if_error: false

      - name: Archive the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: target/coverage/

      # The same suite as the `test` job, against the inbuilt database.
      - name: Run Integration Tests on the inbuilt database
        run: make integration-test-sqlite

  mq-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make zip

      - name: Run MQ Integration Tests
        run: make mq-integration-test
