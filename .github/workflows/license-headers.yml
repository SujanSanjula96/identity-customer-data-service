name: License Headers

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a pull request, files the PR adds must also carry the current year.
      - name: Check the license headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-license-headers BASE_REF="$BASE_SHA"
