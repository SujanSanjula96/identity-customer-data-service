# Runs the integration suite against the databases you pick. It runs only when started
# by hand: Actions > TestGrid > Run workflow, or
#
#   gh workflow run testgrid.yml -f databases=mysql,mssql --ref <branch>
#
# The PR Builder keeps the PostgreSQL and SQLite suites. The slower ones, MySQL and
# SQL Server, run from here. The branch picked in "Use workflow from" is the code that
# is tested.
#
# To offer another database, add a line to the table in utils/testgrid-plan.sh and name
# it in the description of `databases` below.

name: TestGrid

run-name: TestGrid (${{ inputs.databases }})

on:
  workflow_dispatch:
    inputs:
      databases:
        description: 'Databases to run, separated by commas: postgres, sqlite, mysql, mssql. Use "all" for every one.'
        required: false
        type: string
        default: 'all'
      test:
        description: 'Only the tests whose names match, for example Test_Profile|Test_Consent. Empty runs every test.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      test: ${{ steps.plan.outputs.test }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The inputs reach the script as environment variables, never inside the script text.
      - name: Work out which databases to run
        id: plan
        env:
          DATABASES: ${{ inputs.databases }}
          TEST_FILTER: ${{ inputs.test }}
        run: bash .github/workflows/utils/testgrid-plan.sh

  integration:
    name: ${{ matrix.db }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One database failing does not stop the others, so one run shows every result.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install system deps
        run: sudo apt-get install -y make

      - name: Run Integration Tests on ${{ matrix.db }}
        env:
          TARGET: ${{ matrix.target }}
          TEST_FILTER: ${{ needs.plan.outputs.test }}
        run: |
          args=()
          if [ -n "$TEST_FILTER" ]; then
            args+=("test=$TEST_FILTER")
          fi
          make "$TARGET" ${args[@]+"${args[@]}"}
